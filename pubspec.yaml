name: vdownloader
description: A professional task manager built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0  # المتصفح الداخلي
  dio: ^5.4.0                   # لتحميل الملفات
  path_provider: ^2.1.2         # للحصول على مسار التخزين
  permission_handler: ^11.3.0   # لإدارة أذونات التخزين
  flutter_downloader: ^1.11.6   # بديل لتحميل الملفات في الخلفية
flutter:
  uses-material-design: true